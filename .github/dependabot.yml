version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine minor/patch bumps; majors arrive separately.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint (via eslint-config-next) doesn't support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # eslint-plugin-react/-import/-jsx-a11y (via eslint-config-next) declare ESLint <= 9.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # Node typings track the oldest supported runtime (engines.node, CI node-version), not the newest.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
